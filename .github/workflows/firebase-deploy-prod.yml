name: Deploy sdk-spec (prod) to Firebase Hosting

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# Firebase Hosting is mutable state. Never cancel an active deployment; retain
# only the newest waiting run rather than queueing stale site versions.
concurrency:
  group: firebase-hosting-apf-mlops-docs-sdk-spec-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy Firebase Hosting production site
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # WIF の OIDC トークン発行に必須
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'   # pyproject は python >=3.8,<3.12。3.12+ は範囲外
      - name: Build Sphinx
        run: |
          pip install "poetry==1.8.5"
          # dev 依存(mypy -> typed-ast 1.4.3)は 3.10+ でビルド不可。docs には不要なので --only main で除外
          poetry install --only main --extras docs
          poetry run sphinx-build -M html doc/source doc/build
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'   # firebase-tools の STS 交換を壊した Node 22.23.0 を避ける(22.23.1+)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: apf-mlops-docs
          workload_identity_provider: projects/529780319156/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deploy@apf-mlops-docs.iam.gserviceaccount.com
      - name: Deploy to Firebase Hosting (prod site)
        # This repository has no Node manifest; keep the one-off deploy CLI at
        # an exact version until it can be installed from a reviewed lockfile.
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g firebase-tools@15.22.4
          firebase deploy --only hosting:sdk-spec-prod --project apf-mlops-docs --non-interactive
