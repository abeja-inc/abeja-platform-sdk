name: Deploy sdk-spec (dev) to Firebase Hosting

on:
  push:
    branches: [develop, feature/firebase-hosting-auth]   # TEMP: WIF 検証用。確認後 develop のみに戻す
    paths:
      - 'doc/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy-dev.yml'
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # WIF の OIDC トークン発行に必須
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # pyproject は python >=3.8,<3.12。3.12+ は範囲外
      - name: Build Sphinx
        run: |
          pip install "poetry==1.8.5"
          # dev 依存(mypy -> typed-ast 1.4.3)は 3.10+ でビルド不可。docs には不要なので --only main で除外
          poetry install --only main --extras docs
          poetry run sphinx-build -M html doc/source doc/build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # firebase-tools の STS 交換を壊した Node 22.23.0 を避ける(22.23.1+)
      - uses: google-github-actions/auth@v3
        with:
          project_id: apf-mlops-docs
          workload_identity_provider: projects/529780319156/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deploy@apf-mlops-docs.iam.gserviceaccount.com
      - name: Deploy to Firebase Hosting (dev site)
        run: |
          node --version
          npm install -g firebase-tools@15.22.4
          firebase --version
          firebase deploy --only hosting:sdk-spec-dev --project apf-mlops-docs --non-interactive --debug
