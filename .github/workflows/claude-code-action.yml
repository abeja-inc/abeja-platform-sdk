# DEBUG: change to debug PR review for New PR.
name: PR review with Claude Code Action

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

# Keep distinct comments and reviews independent while cancelling duplicate
# work for the same event identity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.comment.id || github.event.review.id || github.event.issue.id || github.run_id }}
  cancel-in-progress: true

jobs:
  claude:
    name: Handle Claude mention
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Update PR metadata and post review feedback.
      issues: write # Reply to issue and PR comments.
      id-token: write # Authenticate to Google Cloud through WIF.
      actions: read # Let Claude inspect CI results.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: ${{ secrets.CLAUDE_VERTEX_AI_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.CLAUDE_VERTEX_AI_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CLAUDE_VERTEX_AI_GCP_SERVICE_ACCOUNT }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1.0.181
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          CLOUD_ML_REGION: us-east5
          CLAUDE_CODE_ENDPOINT: vertex
          ANTHROPIC_VERTEX_ENABLE_PROMPT_CACHING: true
        with:
          use_vertex: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 5
            --allowedTools "Bash(gh pr edit *),Bash(gh pr view *)"
            --system-prompt "PRのコードレビューを行ってください。回答は常に日本語で行ってください。"
